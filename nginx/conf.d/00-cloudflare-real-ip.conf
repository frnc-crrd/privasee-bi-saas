# ==============================================================================
# Cloudflare Real IP Configuration
# ==============================================================================
#
# Purpose:
#   Configures Nginx to correctly identify the true originating IP address of
#   clients when traffic is proxied through Cloudflare's global WAF/CDN network.
#
# Architecture:
#   User → Cloudflare (WAF/CDN) → Nginx (Reverse Proxy) → Application
#
# Technical Implementation:
#   - Trusts Cloudflare's IP ranges using set_real_ip_from directives
#   - Reads CF-Connecting-IP header (Cloudflare's authoritative client IP header)
#   - Enables recursive processing to handle multi-hop proxy chains
#   - Replaces $remote_addr with the real client IP for logging and rate limiting
#
# Security Implications:
#   - Only Cloudflare IPs are trusted (prevents IP spoofing attacks)
#   - Real IP is used for rate limiting (per-user, not per-Cloudflare IP)
#   - Access logs reflect actual client IPs (essential for security auditing)
#   - GeoIP restrictions apply to real client location, not Cloudflare edge
#
# Maintenance:
#   Cloudflare IP ranges are updated periodically. Run the update script:
#   ./scripts/update_cloudflare_ips.sh
#
# Last Updated: 2025-01-27
# IP Ranges Source: https://www.cloudflare.com/ips/
# ==============================================================================

# ==============================================================================
# Real IP Header Configuration
# ==============================================================================

# Set the header that contains the real client IP address
# CF-Connecting-IP is Cloudflare's authoritative header containing the client IP
real_ip_header CF-Connecting-IP;

# Enable recursive processing of X-Forwarded-For header
# Required when traffic passes through multiple proxy layers
real_ip_recursive on;

# ==============================================================================
# Cloudflare IPv4 Address Ranges
# ==============================================================================
# These ranges are owned and operated by Cloudflare's global edge network.
# Traffic originating from these IPs is trusted to provide accurate client IP
# information via the CF-Connecting-IP header.
#
# Source: https://www.cloudflare.com/ips-v4
# Last verified: 2025-01-27

set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

# ==============================================================================
# Cloudflare IPv6 Address Ranges
# ==============================================================================
# IPv6 ranges operated by Cloudflare's global network.
#
# Source: https://www.cloudflare.com/ips-v6
# Last verified: 2025-01-27

set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

# ==============================================================================
# Fallback Configuration (X-Forwarded-For)
# ==============================================================================
# If CF-Connecting-IP is not present (e.g., during local testing or direct access),
# Nginx will fall back to parsing the X-Forwarded-For header.
# This maintains compatibility with standard reverse proxy configurations.
#
# Note: In production with Cloudflare enabled, CF-Connecting-IP will always be
# present and will take precedence over X-Forwarded-For.
# ==============================================================================

# ==============================================================================
# Validation and Testing
# ==============================================================================
#
# Test that real IP detection is working:
#
#   1. Check access logs for real client IPs (not Cloudflare IPs):
#      tail -f /var/log/nginx/privasee_access.log
#
#   2. Verify CF-Connecting-IP header is present:
#      curl -H "CF-Connecting-IP: 203.0.113.42" https://yourdomain.com/health
#
#   3. Test rate limiting with different IPs:
#      for i in {1..20}; do
#        curl -H "CF-Connecting-IP: 203.0.113.$i" https://yourdomain.com/api/v1/users
#      done
#
#   4. Check Nginx configuration syntax:
#      docker compose -f docker-compose.prod.yml exec nginx nginx -t
#
# Expected behavior:
#   - $remote_addr reflects the real client IP (not Cloudflare IP)
#   - Rate limiting applies per real client IP (not per Cloudflare edge server)
#   - Access logs show real client IPs
#   - Application receives real IP via X-Real-IP and X-Forwarded-For headers
#
# ==============================================================================

# ==============================================================================
# Security Considerations
# ==============================================================================
#
# IP Spoofing Protection:
#   Only IPs in the set_real_ip_from directives are trusted. Traffic from any
#   other source attempting to set CF-Connecting-IP or X-Forwarded-For headers
#   will be ignored, preventing IP spoofing attacks.
#
# DDoS Mitigation:
#   Cloudflare provides L3/L4/L7 DDoS protection. Traffic reaching Nginx has
#   already been filtered by Cloudflare's global network.
#
# Rate Limiting:
#   Rate limits defined in privasee.conf (auth_limit, api_limit, conn_limit)
#   now apply per real client IP, not per Cloudflare edge server. This prevents
#   a single malicious user from exhausting rate limits for all users routed
#   through the same Cloudflare POP.
#
# GeoIP Restrictions:
#   If GeoIP-based access control is implemented, restrictions will apply to
#   the real client location, not Cloudflare's edge server location.
#
# ==============================================================================

# ==============================================================================
# Troubleshooting
# ==============================================================================
#
# Issue: Access logs show Cloudflare IPs instead of client IPs
#   Cause: CF-Connecting-IP header not present or Cloudflare IPs not trusted
#   Resolution:
#     1. Verify Cloudflare proxy is enabled (orange cloud in Cloudflare dashboard)
#     2. Check CF-Connecting-IP header: curl -I https://yourdomain.com
#     3. Update Cloudflare IP ranges: ./scripts/update_cloudflare_ips.sh
#     4. Reload Nginx: docker compose -f docker-compose.prod.yml exec nginx nginx -s reload
#
# Issue: Rate limiting triggers for all users
#   Cause: All traffic appears to come from same Cloudflare edge server IP
#   Resolution:
#     1. Verify real_ip_header is set to CF-Connecting-IP
#     2. Check that Cloudflare IPs are trusted (set_real_ip_from directives)
#     3. Ensure this file is loaded before privasee.conf (filename starts with 00-)
#
# Issue: Application receives Cloudflare IP instead of client IP
#   Cause: proxy_set_header X-Real-IP uses $remote_addr after real IP substitution
#   Resolution:
#     This is expected behavior. $remote_addr is correctly replaced with real IP.
#     Verify by checking application logs - they should show real client IPs.
#
# ==============================================================================
