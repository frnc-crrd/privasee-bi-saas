# ==============================================================================
# Nginx Main Configuration
# ==============================================================================
#
# Purpose:
#   Main Nginx configuration for Privasee BI SaaS production deployment.
#   Optimized for high-performance reverse proxy with security hardening.
#
# Architecture:
#   Internet → Cloudflare (WAF/CDN) → Nginx (Reverse Proxy) → Flask App
#
# Security Features:
#   - Real IP detection from Cloudflare (see conf.d/00-cloudflare-real-ip.conf)
#   - Rate limiting per real client IP
#   - Security headers (HSTS, CSP, X-Frame-Options)
#   - TLS 1.2+ only
#
# Performance:
#   - Response caching for static content
#   - Gzip compression enabled
#   - Keepalive connections
#
# ==============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# Maximum number of open files per worker
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    # ==============================================================================
    # Basic Settings
    # ==============================================================================
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ==============================================================================
    # Logging Configuration
    # ==============================================================================
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    log_format detailed '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent" '
                        'rt=$request_time uct="$upstream_connect_time" '
                        'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log detailed;

    # ==============================================================================
    # Performance Tuning
    # ==============================================================================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;
    server_tokens off;

    # ==============================================================================
    # Gzip Compression
    # ==============================================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # ==============================================================================
    # Security Headers (Global)
    # ==============================================================================
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ==============================================================================
    # Rate Limiting Zones
    # ==============================================================================
    # Define rate limiting zones based on real client IP ($remote_addr)
    # After Cloudflare real IP substitution, $remote_addr = real client IP

    limit_req_zone $remote_addr zone=auth_limit:10m rate=5r/m;
    limit_req_zone $remote_addr zone=api_limit:10m rate=50r/m;
    limit_conn_zone $remote_addr zone=conn_limit:10m;

    # ==============================================================================
    # Upstream Backend (Flask Application)
    # ==============================================================================
    upstream flask_backend {
        server privasee-app:5000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # ==============================================================================
    # Virtual Host Configurations
    # ==============================================================================
    # Load additional configurations from conf.d/
    # Order matters: 00-cloudflare-real-ip.conf loads first
    include /etc/nginx/conf.d/*.conf;
}
